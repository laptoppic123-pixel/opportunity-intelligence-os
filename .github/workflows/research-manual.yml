name: Opportunity OS bounded worker
'on':
  workflow_dispatch:
    inputs:
      command:
        description: Approved operation; doctor makes no network calls
        type: choice
        options:
        - doctor
        - discover
        - analyze
        - enrich
        - challenge
        - deep-dive
        - report
        - backup
        default: doctor
        required: true
      authorize_live:
        description: Owner authorizes bounded live execution after connection testing
        type: boolean
        default: false
      included_allowance_confirmed:
        description: Included Actions capacity and spending limits checked
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: opportunity-os-global-worker
  cancel-in-progress: false
jobs:
  worker:
    if: ${{ inputs.included_allowance_confirmed && github.ref == 'refs/heads/main' && (inputs.command == 'doctor' || (inputs.authorize_live
      && vars.OI_ACTIVATED == 'true' && vars.OI_LIVE_ENABLED == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OI_ACTIVATED: ${{ vars.OI_ACTIVATED || 'false' }}
      OI_LIVE_ENABLED: ${{ vars.OI_LIVE_ENABLED || 'false' }}
      OI_PAID_ENABLED: ${{ vars.OI_PAID_ENABLED || 'false' }}
      OI_MONTHLY_LIMIT_USD: ${{ vars.OI_MONTHLY_LIMIT_USD || '20' }}
      OI_INTERNAL_PAID_STOP_USD: ${{ vars.OI_INTERNAL_PAID_STOP_USD || '19' }}
      OI_OWNER_ID: ${{ vars.OI_OWNER_ID }}
      FAST_MODEL: ${{ vars.FAST_MODEL }}
      DEEP_MODEL: ${{ vars.DEEP_MODEL }}
      CRITIC_MODEL: ${{ vars.CRITIC_MODEL }}
      HAIMAKER_FAST_MODEL: ${{ vars.HAIMAKER_FAST_MODEL }}
      HAIMAKER_DEEP_MODEL: ${{ vars.HAIMAKER_DEEP_MODEL }}
      HAIMAKER_CRITIC_MODEL: ${{ vars.HAIMAKER_CRITIC_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HAIMAKER_API_KEY: ${{ secrets.HAIMAKER_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
      STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      PROCUREMENT_API_KEY: ${{ secrets.PROCUREMENT_API_KEY }}
      OI_BACKUP_ENCRYPTION_KEY: ${{ secrets.OI_BACKUP_ENCRYPTION_KEY }}
      OI_MAX_REQUESTS: '10'
      OI_MAX_SECONDS: '180'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Install locked Python 3.12 application
      run: 'python3 -m pip install uv==0.9.8 --disable-pip-version-check

        uv sync --locked --no-dev'
    - name: Run one bounded task
      env:
        OI_COMMAND: ${{ inputs.command }}
      run: "if [ \"$OI_COMMAND\" = doctor ]; then\n  uv run --no-sync oi doctor\nelif [ \"$OI_COMMAND\" = backup ]; then\n\
        \  uv run --no-sync oi --live backup --upload\nelse\n  uv run --no-sync oi --live \"$OI_COMMAND\"\nfi"
    - name: Summarize status without source content
      if: always()
      env:
        RESULT: ${{ job.status }}
      run: 'printf ''Opportunity OS worker status: %s\n'' "$RESULT" >> "$GITHUB_STEP_SUMMARY"'
